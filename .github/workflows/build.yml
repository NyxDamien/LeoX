name: Build LeoX APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q LeoX.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: LeoX
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp LeoX/app/build/outputs/apk/debug/app-debug.apk LeoX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeoX-apk
          path: LeoX.apk
